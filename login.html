<!DOCTYPE html>
<html>
<head>

<title>Login</title>

<link rel="stylesheet"
href="css/style.css">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<!-- Header/Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center"
           href="index.html">

            <img src="Assests/logo.png"
                 width="40"
                 height="40"
                 class="rounded-circle me-2"
                 alt="Logo">

            <span class="fw-bold">
                FreshKart Farm
            </span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse"
             id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        <i class="fa-solid fa-house me-1"></i>
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="login.html">
                        Login
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="signup.html">
                        Sign Up
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>
<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4">

<h2 class="text-center mb-4">

Login

</h2>

<form id="loginForm">

<input
id="email"
type="email"
class="form-control mb-3"
placeholder="Email"
required>

<input
id="password"
type="password"
class="form-control mb-3"
placeholder="Password"
required>

<select
class="form-select mb-3"
id="role">

<option>
Customer
</option>

<option>
Farmer
</option>

<option>
Admin
</option>

</select>

<button
class="btn btn-success w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>
</html>
