<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Farmer Dashboard | FreshKart Farm</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            background: #f8f9fa;
        }

        .dashboard-card {
            border: none;
            border-radius: 20px;
            transition: 0.4s;
        }

        .dashboard-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .table img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
        }
    </style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-success">

    <div class="container">

        <a class="navbar-brand d-flex align-items-center"
           href="index.html">

            <img src="Assests/logo.png"
                 width="40"
                 height="40"
                 class="rounded-circle me-2">

            FreshKart Farm

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="orders.html">
                        Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a class="btn btn-danger ms-3"
                       href="login.html">

                        Logout

                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- HEADING -->

<div class="container py-5">

    <h1 class="text-center text-success mb-5">

        <i class="fa-solid fa-seedling"></i>

        Farmer Dashboard

    </h1>

    <!-- DASHBOARD CARDS -->

    <div class="row g-4">

        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card text-center p-4">

                <i class="fa-solid fa-carrot fa-3x text-success mb-3"></i>

                <h2>15</h2>

                <p>Total Products</p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card text-center p-4">

                <i class="fa-solid fa-box fa-3x text-warning mb-3"></i>

                <h2>250</h2>

                <p>Available Stock</p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card text-center p-4">

                <i class="fa-solid fa-cart-shopping fa-3x text-primary mb-3"></i>

                <h2>45</h2>

                <p>Orders</p>

            </div>

        </div>

        <div class="col-lg-3 col-md-6">

            <div class="card dashboard-card text-center p-4">

                <i class="fa-solid fa-indian-rupee-sign fa-3x text-danger mb-3"></i>

                <h2>₹12,500</h2>

                <p>Revenue</p>

            </div>

        </div>

    </div>

</div>

<!-- ADD PRODUCT -->

<div class="container mb-5">

    <div class="form-box">

        <h3 class="mb-4 text-success">

            Add New Product

        </h3>

        <form>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <input type="text"
                           class="form-control"
                           placeholder="Product Name">

                </div>

                <div class="col-md-3 mb-3">

                    <input type="number"
                           class="form-control"
                           placeholder="Price">

                </div>

                <div class="col-md-3 mb-3">

                    <input type="number"
                           class="form-control"
                           placeholder="Quantity">

                </div>

                <div class="col-md-2 mb-3">

                    <button class="btn btn-success w-100">

                        Add

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

<!-- PRODUCT TABLE -->

<div class="container mb-5">

    <h3 class="text-success mb-4">

        My Products

    </h3>

    <div class="table-responsive">

        <table class="table table-bordered table-hover text-center">

            <thead class="table-success">

            <tr>

                <th>Image</th>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <td>
                    <img src="Assests/Tomato.jpg">
                </td>

                <td>Tomato</td>

                <td>₹40</td>

                <td>50 Kg</td>

                <td>

                    <button class="btn btn-warning btn-sm">

                        Edit

                    </button>

                    <button class="btn btn-danger btn-sm">

                        Delete

                    </button>

                </td>

            </tr>

            <tr>

                <td>
                    <img src="Assests/beetroot.jpg">
                </td>

                <td>Beetroot</td>

                <td>₹60</td>

                <td>40 Kg</td>

                <td>

                    <button class="btn btn-warning btn-sm">

                        Edit

                    </button>

                    <button class="btn btn-danger btn-sm">

                        Delete

                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

<!-- FOOTER -->

<footer class="bg-dark text-white text-center p-4">

    © 2026 FreshKart Farm | Farmer Dashboard

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
