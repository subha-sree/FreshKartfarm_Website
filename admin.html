<!DOCTYPE html>
<html>
<head>
<link rel="shortcut icon" href="Assests/logo.png" type="image/x-icon">
<title>
Admin Dashboard
</title>

<link rel="stylesheet"
href="css/style.css">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<!-- Header/Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand d-flex align-items-center"
           href="index.html">

            <img src="Assests/logo.png"
                 width="40"
                 height="40"
                 class="rounded-circle me-2"
                 alt="Logo">

            <span class="fw-bold">
                FreshKart Farm
            </span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse"
             id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        <i class="fa-solid fa-house me-1"></i>
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <button class="btn btn-outline-light ms-3" data-logout>
                        Logout
                    </button>
                </li>

            </ul>

        </div>

    </div>
</nav>
<div class="container py-5" id="adminDashboard">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Admin Dashboard</h1>
            <p class="text-muted">Welcome, <strong id="adminName"></strong></p>
        </div>
        <div class="text-end">
            <p class="mb-1"><strong>Email:</strong> <span id="adminEmail"></span></p>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <h2 id="adminCustomers">0</h2>
                    <p>Customers</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <h2 id="adminFarmers">0</h2>
                    <p>Farmers</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <h2 id="adminOrders">0</h2>
                    <p>Orders</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card stat-card">
                <div class="card-body text-center">
                    <h2 id="adminProducts">0</h2>
                    <p>Products</p>
                </div>
            </div>
        </div>

    </div>

    <div class="mt-5">
        <h3>Recent Orders</h3>
        <ul class="list-group" id="orders"></ul>
    </div>

    <div class="mt-5">
        <h3>Add Product</h3>
        <form id="addProductForm" class="row g-3">
            <div class="col-md-4">
                <input id="productName" type="text" class="form-control" placeholder="Product Name" required>
            </div>
            <div class="col-md-3">
                <input id="productPrice" type="number" class="form-control" placeholder="Price" required>
            </div>
            <div class="col-md-3">
                <input id="productQuantity" type="number" class="form-control" placeholder="Quantity" required>
            </div>
            <div class="col-md-3">
                <input id="productImage" type="text" class="form-control" placeholder="Image URL" required>
            </div>
            <div class="col-12">
                <button class="btn btn-success">Add Product</button>
            </div>
        </form>
    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
