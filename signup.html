<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FreshKart Farm | Sign Up</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.5)),
                url("Assests/bg_5.webp");

            background-size: cover;
            background-position: center;
            padding: 30px;
        }

        .signup-card {
            width: 100%;
            max-width: 550px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            background: #198754;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
        }

        .btn-success {
            border-radius: 10px;
            font-size: 18px;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    

    <div class="card signup-card">

        <div class="card-header">

            <img src="Assests/logo.png"
                class="logo"
                alt="Logo">

            <h2>FreshKart Farm</h2>
            <p>Create Your Account</p>

        </div>

        <div class="card-body p-4">

            <form id="signupForm">

                <div class="mb-3">
                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        id="fullname"
                        type="text"
                        class="form-control"
                        placeholder="Enter Full Name"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        placeholder="Enter Email"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        class="form-control"
                        placeholder="Enter Mobile Number"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>

                    <textarea
                        id="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter Address"
                        required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Register As
                    </label>

                    <select
                        id="role"
                        class="form-select"
                        required>

                        <option value="">
                            Select Role
                        </option>

                        <option>
                            Customer
                        </option>

                        <option>
                            Farmer
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        class="form-control"
                        placeholder="Create Password"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        id="confirmPassword"
                        type="password"
                        class="form-control"
                        placeholder="Confirm Password"
                        required>
                </div>

                <div class="form-check mb-3">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="showPassword">

                    <label
                        class="form-check-label">

                        Show Password

                    </label>

                </div>

                <button
                    class="btn btn-success w-100">

                    <i class="fa-solid fa-user-plus"></i>

                    Sign Up

                </button>

                <div class="text-center mt-3">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/script.js"></script>

</body>

</html>
